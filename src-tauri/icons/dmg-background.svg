<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景颜色 -->
  <rect width="600" height="400" fill="#F2F2F7"/>
  
  <!-- 装饰性渐变 -->
  <circle cx="300" cy="400" r="300" fill="url(#paint0_radial)" fill-opacity="0.3"/>

  <!-- 安装箭头 -->
  <path d="M280 150H320M320 150L300 130M320 150L300 170" stroke="#8E8E93" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 说明文字区域 -->
  <rect x="50" y="280" width="500" height="80" rx="12" fill="white" fill-opacity="0.8"/>
  <text x="300" y="315" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1C1C1E">安装指南</text>
  <text x="300" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3A3A3C">将左侧 DroidDock 拖入右侧 Applications 文件夹</text>
  
  <!-- 针对“损坏”提示的特别说明 -->
  <text x="300" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8E8E93">※ 若提示“已损坏”，请在应用程序中：右键点击图标 -> 选择“打开”</text>

  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" transform="translate(300 400) rotate(90) scale(300)">
      <stop stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
