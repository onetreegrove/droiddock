[package]
name = "droiddock"
version = "0.1.0"
description = "macOS Apple Silicon Android screen mirroring and control console."
authors = ["DroidDock"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "droiddock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
